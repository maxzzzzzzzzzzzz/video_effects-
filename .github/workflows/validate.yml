name: Validate registry

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate registry and effects
        run: python3 scripts/validate_registry.py

      - name: Install glslang
        run: sudo apt-get update -q && sudo apt-get install -y -q glslang-tools

      - name: Compile all shaders
        run: |
          status=0
          for f in effects/*/*.glsl transitions/*/*.glsl; do
            echo "== $f"
            glslangValidator -S frag "$f" || status=1
          done
          exit $status
