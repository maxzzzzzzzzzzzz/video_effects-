name: Stamp registry revision

on:
  push:
    branches: [main]

# Note: pushes made by this workflow use the default GITHUB_TOKEN,
# which does not trigger new workflow runs, so this cannot loop.

permissions:
  contents: write

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp revision into registry.json
        run: |
          python3 - <<'EOF'
          import json

          with open("registry.json") as f:
              registry = json.load(f)

          registry["revision"] = "${{ github.sha }}"
          registry["updatedAt"] = "${{ github.event.head_commit.timestamp }}"

          with open("registry.json", "w") as f:
              json.dump(registry, f, indent=2)
              f.write("\n")
          EOF

      - name: Commit and push if changed
        run: |
          if git diff --quiet registry.json; then
            echo "No changes to registry.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add registry.json
          git commit -m "chore: stamp registry revision ${{ github.sha }}"
          git push
